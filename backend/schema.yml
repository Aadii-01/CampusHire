components:
  schemas:
    ApplicationCreate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          type: integer
        resume:
          type: integer
          nullable: true
        cover_letter:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/ApplicationStatusEnum'
          readOnly: true
        applied_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - applied_at
      - id
      - job
      - status
      - updated_at
    ApplicationCreateRequest:
      type: object
      properties:
        job:
          type: integer
        resume:
          type: integer
          nullable: true
        cover_letter:
          type: string
      required:
      - job
    ApplicationStatusEnum:
      enum:
      - APPLIED
      - UNDER_REVIEW
      - SHORTLISTED
      - INTERVIEW
      - SELECTED
      - REJECTED
      - OFFERED
      - OFFER_ACCEPTED
      - OFFER_DECLINED
      type: string
      description: |-
        * `APPLIED` - Applied
        * `UNDER_REVIEW` - Under Review
        * `SHORTLISTED` - Shortlisted
        * `INTERVIEW` - Interview
        * `SELECTED` - Selected
        * `REJECTED` - Rejected
        * `OFFERED` - Offered
        * `OFFER_ACCEPTED` - Offer Accepted
        * `OFFER_DECLINED` - Offer Declined
    ApplicationStatusUpdate:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - id
      - updated_at
    ApplicationStatusUpdateRequest:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ApplicationStatusEnum'
    Company:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        industry:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 150
        company_size:
          type: string
          maxLength: 50
        logo:
          type: string
          format: uri
          nullable: true
        is_verified:
          type: boolean
          readOnly: true
        recruiter_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_verified
      - name
      - recruiter_count
      - updated_at
    CompanyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
        website:
          oneOf:
          - type: string
            format: uri
            maxLength: 200
          - type: string
            maxLength: 0
        industry:
          type: string
          maxLength: 100
        location:
          type: string
          maxLength: 150
        company_size:
          type: string
          maxLength: 50
        logo:
          type: string
          format: binary
          nullable: true
      required:
      - name
    Education:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        institution:
          type: string
          maxLength: 200
        degree:
          type: string
          maxLength: 100
        field_of_study:
          type: string
          maxLength: 100
        start_year:
          type: integer
          maximum: 2147483647
          minimum: 0
        end_year:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
        percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          nullable: true
        cgpa:
          type: string
          format: decimal
          pattern: ^-?\d{0,2}(?:\.\d{0,2})?$
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
